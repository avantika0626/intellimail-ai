version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: intellimail_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intellimail_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/intellimail_ai
      - JWT_SECRET=production_jwt_secret_key_change_me
      - ENCRYPTION_KEY=production_32_byte_aes_encryption_key_change
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: intellimail_client
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
